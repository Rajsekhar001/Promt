<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROYAL UNBAN - Terminal Console</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      background-color: #030805;
      background-image: radial-gradient(rgba(0, 255, 102, 0.15) 1px, transparent 0);
      background-size: 24px 24px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #00ff66;
      padding: 15px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      border: 1px solid #00ff66;
      border-radius: 12px;
      padding: 25px 20px;
      text-align: center;
      background: rgba(0, 15, 5, 0.94);
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.35);
      position: relative;
    }
    .status-bar {
      font-size: 11px;
      color: #00aa44;
      text-align: left;
      margin-bottom: 12px;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }
    .logo {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      border: 2px solid #00ff66;
      box-shadow: 0 0 15px #00ff66;
      object-fit: cover;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00ff66;
    }
    p {
      font-size: 12px;
      color: #00cc55;
      margin-bottom: 16px;
    }
    .ip-box {
      font-size: 12px;
      padding: 8px;
      background: #011507;
      border: 1px dashed #008833;
      border-radius: 6px;
      margin-bottom: 15px;
      color: #77ffaa;
      word-break: break-all;
    }
    .input-box {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #00ff66;
      background: #001508;
      color: #00ff66;
      font-size: 14px;
      outline: none;
      margin-bottom: 14px;
      text-align: center;
      box-shadow: inset 0 0 8px rgba(0, 255, 102, 0.2);
    }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #00ff66;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      background: transparent;
      color: #00ff66;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.25s ease;
    }
    .btn:hover, .btn:active {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 18px #00ff66;
    }
    #terminalConsole {
      display: none;
      text-align: left;
      font-size: 11px;
      color: #33ff77;
      background: #010a04;
      border: 1px solid #008833;
      padding: 10px;
      border-radius: 6px;
      height: 160px;
      overflow-y: auto;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .timer-display {
      display: none;
      font-size: 11px;
      color: #ffaa00;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .progress-wrapper {
      display: none;
      width: 100%;
      background: #00220d;
      border: 1px solid #00ff66;
      border-radius: 6px;
      height: 22px;
      position: relative;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #00ff66;
      box-shadow: 0 0 10px #00ff66;
      transition: width 0.8s linear;
    }
    .progress-text {
      position: absolute;
      width: 100%;
      top: 3px;
      left: 0;
      font-size: 11px;
      color: #ffffff;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-box {
      width: 85%;
      max-width: 320px;
      background: #0a0101;
      border: 2px solid #ff2222;
      border-radius: 10px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 34, 34, 0.6);
      color: #ff4444;
      animation: alertBlink 1s infinite alternate;
    }
    @keyframes alertBlink {
      0% { box-shadow: 0 0 15px rgba(255, 34, 34, 0.4); }
      100% { box-shadow: 0 0 35px rgba(255, 34, 34, 0.9); }
    }
    .modal-box h3 {
      font-size: 18px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .modal-box p {
      font-size: 12px;
      color: #f1f1f1;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .btn-admin {
      background: #ff2222;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 1px;
      box-shadow: 0 0 12px rgba(255, 34, 34, 0.5);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="status-bar">
      <span>[SYS]: ONLINE</span>
      <span>NODE: ROYAL_UNBAN</span>
    </div>
    
    <!-- Royal Unban Logo -->
    <img src="https://raw.githubusercontent.com/Rajsekhar001/Promt/main/IMG_20261017_122814_174.jpg" alt="ROYAL UNBAN Logo" class="logo" />
    
    <h2>ROYAL UNBAN</h2>
    <p>&gt; SECURE SYSTEM PROTOCOL &lt;</p>

    <!-- Client IP Banner -->
    <div class="ip-box" id="userIpDisplay">TARGET IP: FETCHING...</div>

    <!-- STEP 1: KEY VERIFICATION -->
    <div id="stepKey">
      <input type="text" id="keyInput" class="input-box" placeholder="ENTER ACCESS KEY..." />
      <button class="btn" onclick="verifyKey()">[ VERIFY KEY ]</button>
      <button class="btn" onclick="openTelegram()">[ GET KEY ]</button>
    </div>

    <!-- STEP 2: UID INPUT -->
    <div id="stepUID" style="display: none;">
      <input type="text" id="uidInput" class="input-box" placeholder="ENTER TARGET UID..." />
      <button class="btn" onclick="startBypass()">[ EXECUTE UNBAN PROTOCOL ]</button>
    </div>

    <!-- STEP 3: TERMINAL LOGS & 5-MIN PROGRESS -->
    <div id="terminalConsole"></div>
    <div class="timer-display" id="timerDisplay">TIME ELAPSED: 00:00 / 05:00</div>
    <div class="progress-wrapper" id="progressWrapper">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
  </div>

  <!-- POPUP MODAL (85% HOLD) -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-box">
      <h3>⚠️ SECURITY HOLD: 85%</h3>
      <p>FIREBASE GATEWAY LOCKED.<br>CONTACT OFFICIAL ADMIN ON TELEGRAM TO GET FINAL RELEASE KEY.</p>
      <button class="btn-admin" onclick="openTelegram()">CONTACT ADMIN</button>
    </div>
  </div>

  <script>
    const VALID_KEY = "ROYALUNBAN_PAID67G5R8";
    let clientIP = "127.0.0.1";
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playBeep(freq = 650, duration = 0.04) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playAlarm() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.3);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.6);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      } catch (e) {}
    }

    // IP Detection
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => {
        clientIP = data.ip;
        document.getElementById("userIpDisplay").innerText = "CLIENT IP: " + clientIP;
      })
      .catch(() => {
        document.getElementById("userIpDisplay").innerText = "CLIENT IP: 103.112.44.18";
      });

    // Telegram Profile @ROYAL_UNBAN
    function openTelegram() {
      window.location.href = "tg://resolve?domain=ROYAL_UNBAN";
      setTimeout(function() {
        window.location.href = "https://t.me/ROYAL_UNBAN";
      }, 500);
    }

    function verifyKey() {
      initAudio();
      playBeep(900, 0.08);
      const enteredKey = document.getElementById("keyInput").value.trim();

      if (enteredKey === VALID_KEY) {
        document.getElementById("stepKey").style.display = "none";
        document.getElementById("stepUID").style.display = "block";
      } else {
        alert(">> INVALID ACCESS KEY // REDIRECTING TO @ROYAL_UNBAN...");
        openTelegram();
      }
    }

    function logTerminal(message) {
      const consoleBox = document.getElementById("terminalConsole");
      consoleBox.innerHTML += `<div>&gt; ${message}</div>`;
      consoleBox.scrollTop = consoleBox.scrollHeight;
      playBeep(450 + Math.random() * 400, 0.03);
    }

    function startBypass() {
      initAudio();
      const uid = document.getElementById("uidInput").value.trim();
      if (!uid) {
        alert("Please enter target UID!");
        return;
      }

      document.getElementById("stepUID").style.display = "none";
      const consoleBox = document.getElementById("terminalConsole");
      const timerDisplay = document.getElementById("timerDisplay");
      const progressWrapper = document.getElementById("progressWrapper");
      const progressFill = document.getElementById("progressFill");
      const progressText = document.getElementById("progressText");

      consoleBox.style.display = "block";
      timerDisplay.style.display = "block";
      progressWrapper.style.display = "block";

      logTerminal(`SESSION INITIALIZED // ROYAL_UNBAN ROOT`);
      logTerminal(`TARGET UID REGISTERED: [${uid}]`);
      logTerminal(`CLIENT IP: [${clientIP}]`);

      const TOTAL_SECONDS = 300; // 5 Minutes = 300 seconds
      let elapsedSeconds = 0;

      // Real technical log events scheduled across the 5 minutes
      const timelineLogs = [
        { sec: 10, msg: "INITIALIZING TLS 1.3 SECURE HANDSHAKE..." },
        { sec: 25, msg: "PINGING FIREBASE REALTIME REGION (asia-south1)..." },
        { sec: 45, msg: "CLOUDFLARE WAF DEFENSES DETECTED. APPLYING BYPASS..." },
        { sec: 70, msg: "CRACKING SHARD CERTIFICATE FOR CLUSTER #03..." },
        { sec: 95, msg: "INJECTING PROTOBUF PACKET TO GARENA AUTH SERVERS..." },
        { sec: 125, msg: "RESOLVING UID STATE IN DISTRIBUTED LEDGER..." },
        { sec: 155, msg: "ROTATING PROXY TUNNEL NODE [Tor-Exit-Node-09]..." },
        { sec: 185, msg: "OVERRIDING SERVER-SIDE REPUTATION FLAGS..." },
        { sec: 220, msg: "DE-SYNCHRONIZING BAN RECORD FROM DATABASE..." },
        { sec: 250, msg: "APPLYING SHA-256 INTEGRITY HASH VERIFICATION..." },
        { sec: 280, msg: "ATTEMPTING FINAL CLOUD SYNCHRONIZATION..." }
      ];

      const proxyPool = [
        "185.220.101.45 (Tor Relay - Frankfurt)",
        "104.244.42.129 (Nordic Secure Hop)",
        "45.154.255.88 (Shadowsocks Layer)",
        "194.26.29.112 (Ghost Routing Tunnel)",
        "91.240.118.230 (Encrypted Gateway)"
      ];

      const runTimer = setInterval(function() {
        elapsedSeconds++;

        // mm:ss format calculation
        let mins = Math.floor(elapsedSeconds / 60);
        let secs = elapsedSeconds % 60;
        timerDisplay.innerText = `TIME ELAPSED: ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')} / 05:00`;

        // Smooth progress up to 85% across 300 seconds
        let currentProgress = (elapsedSeconds / TOTAL_SECONDS) * 85;
        if (currentProgress > 85) currentProgress = 85;

        progressFill.style.width = currentProgress.toFixed(1) + "%";
        progressText.innerText = currentProgress.toFixed(0) + "%";

        // Check scheduled logs
        timelineLogs.forEach(entry => {
          if (entry.sec === elapsedSeconds) {
            logTerminal(entry.msg);
          }
        });

        // IP Change every 50 seconds
        if (elapsedSeconds % 50 === 0 && elapsedSeconds < 290) {
          const newIp = proxyPool[Math.floor(Math.random() * proxyPool.length)];
          logTerminal(`[NETWORK] ROTATING IP ADDRESS TO AVOID DETECTION...`);
          logTerminal(`[NEW PROXY] => ${newIp}`);
          document.getElementById("userIpDisplay").innerText = "SPOOFED IP: " + newIp;
        }

        // Exact 5 Minutes (300 seconds) reached -> Stop at 85% & Trigger Warning
        if (elapsedSeconds >= TOTAL_SECONDS) {
          clearInterval(runTimer);
          logTerminal("CRITICAL: CLUSTER GATEWAY LOCKED AT 85%!");
          logTerminal("SECURITY AUTH TOKEN REQUIRED FROM ADMIN...");
          playAlarm();

          setTimeout(function() {
            document.getElementById("adminModal").style.display = "flex";
            setInterval(playAlarm, 2800);
          }, 700);
        }
      }, 1000);
    }
  </script>

</body>
</html>
