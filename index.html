<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Unban Terminal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      background-color: #030805;
      background-image: radial-gradient(rgba(0, 255, 102, 0.15) 1px, transparent 0);
      background-size: 24px 24px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #00ff66;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      border: 1px solid #00ff66;
      border-radius: 12px;
      padding: 28px 20px;
      text-align: center;
      background: rgba(0, 15, 5, 0.85);
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.35), inset 0 0 15px rgba(0, 255, 102, 0.1);
      position: relative;
    }
    .status-bar {
      font-size: 11px;
      color: #00aa44;
      text-align: left;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }
    .logo {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      border: 2px solid #00ff66;
      box-shadow: 0 0 15px #00ff66;
      object-fit: cover;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00ff66;
    }
    p {
      font-size: 12px;
      color: #00cc55;
      margin-bottom: 22px;
      letter-spacing: 1px;
    }
    .input-box {
      width: 100%;
      padding: 13px;
      border-radius: 6px;
      border: 1px solid #00ff66;
      background: #001508;
      color: #00ff66;
      font-size: 14px;
      outline: none;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: inset 0 0 8px rgba(0, 255, 102, 0.2);
    }
    .input-box::placeholder {
      color: #006622;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 6px;
      border: 1px solid #00ff66;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      background: transparent;
      color: #00ff66;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.25s ease;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
    }
    .btn:hover, .btn:active {
      background: #00ff66;
      color: #000000;
      box-shadow: 0 0 20px #00ff66;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="status-bar">[SYSTEM]: ONLINE // ROOT_ACCESS</div>
    
    <!-- Aapka Logo -->
    <img src="https://raw.githubusercontent.com/Rajsekhar001/PR-BOT-/main/IMG_20260906_151551_515.png" alt="Apex Logo" class="logo" />
    
    <h2>Apex Unban</h2>
    <p>&gt; SECURE BYPASS CONSOLE &lt;</p>

    <!-- Key Input -->
    <input type="text" id="keyInput" class="input-box" placeholder="ENTER ACCESS KEY..." />

    <!-- Action Button -->
    <button class="btn" onclick="checkKey()">[ EXECUTE UNBAN ID ]</button>

    <!-- Get Key Button -->
    <button class="btn" onclick="openTelegram()">[ GET ACCESS KEY ]</button>
  </div>

  <script>
    const VALID_KEY = "APEXUNBAN_PAID67G5R8";

    function openTelegram() {
      window.location.href = "tg://resolve?domain=Owneroffapex";
      setTimeout(function() {
        window.location.href = "https://t.me/Owneroffapex";
      }, 500);
    }

    function checkKey() {
      const userKey = document.getElementById("keyInput").value.trim();

      if (userKey === VALID_KEY) {
        alert(">> ACCESS GRANTED // EXECUTING PROTOCOL...");
      } else {
        alert(">> ACCESS DENIED // INVALID KEY // REDIRECTING...");
        openTelegram();
      }
    }
  </script>

</body>
</html>
