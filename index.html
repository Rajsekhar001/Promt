<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROYAL UNBAN - VIP ACCESS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      background-color: #050608;
      background-image: radial-gradient(rgba(212, 175, 55, 0.12) 1px, transparent 0);
      background-size: 20px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffd700;
      padding: 15px;
    }
    .card {
      width: 100%;
      max-width: 410px;
      border: 1px solid #d4af37;
      border-radius: 14px;
      padding: 24px 20px;
      text-align: center;
      background: rgba(12, 14, 18, 0.95);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
      position: relative;
    }
    .vip-badge {
      display: inline-block;
      background: linear-gradient(90deg, #d4af37, #f39c12);
      color: #000;
      font-weight: 900;
      font-size: 13px;
      padding: 7px 18px;
      border-radius: 20px;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      box-shadow: 0 0 12px rgba(243, 156, 18, 0.6);
      text-transform: uppercase;
    }
    .sub-badge {
      font-size: 11px;
      color: #f1c40f;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.4);
      object-fit: cover;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 21px;
      margin-bottom: 4px;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px #d4af37;
    }
    p {
      font-size: 11px;
      color: #bdc3c7;
      margin-bottom: 14px;
    }
    .ip-box {
      font-size: 11px;
      padding: 8px;
      background: #0d1117;
      border: 1px dashed #d4af37;
      border-radius: 6px;
      margin-bottom: 14px;
      color: #f1c40f;
    }
    .input-box {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #d4af37;
      background: #08090c;
      color: #ffd700;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #d4af37;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      background: transparent;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.25s;
    }
    .btn:hover, .btn:active {
      background: #d4af37;
      color: #000;
      box-shadow: 0 0 16px #d4af37;
    }
    #terminalConsole {
      display: none;
      text-align: left;
      font-size: 11px;
      color: #f1c40f;
      background: #050608;
      border: 1px solid #7f8c8d;
      padding: 10px;
      border-radius: 6px;
      height: 140px;
      overflow-y: auto;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .timer-display {
      display: none;
      font-size: 11px;
      color: #e67e22;
      margin-bottom: 8px;
    }
    .progress-wrapper {
      display: none;
      width: 100%;
      background: #111;
      border: 1px solid #d4af37;
      border-radius: 6px;
      height: 20px;
      position: relative;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #d4af37, #f39c12);
      transition: width 0.8s linear;
    }
    .progress-text {
      position: absolute;
      width: 100%;
      top: 2px;
      left: 0;
      font-size: 11px;
      color: #ffffff;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }
    .switch-panel {
      display: none;
      border: 1px solid #f39c12;
      padding: 12px;
      border-radius: 8px;
      background: #10141a;
      margin-bottom: 12px;
      animation: glowBox 1s infinite alternate;
    }
    @keyframes glowBox {
      0% { box-shadow: 0 0 5px rgba(243, 156, 18, 0.3); }
      100% { box-shadow: 0 0 15px rgba(243, 156, 18, 0.7); }
    }
    .switch-panel p {
      font-size: 11px;
      color: #ffd700;
      margin-bottom: 8px;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-box {
      width: 85%;
      max-width: 320px;
      background: #0f0505;
      border: 2px solid #e74c3c;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 30px rgba(231, 76, 60, 0.6);
      color: #e74c3c;
    }
    .modal-box h3 {
      font-size: 17px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .modal-box p {
      font-size: 11px;
      color: #ecf0f1;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .btn-admin {
      background: #e74c3c;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body onclick="playWelcomeVoice()" ontouchstart="playWelcomeVoice()">

  <!-- Audio Element for Paidvoice.mp3 -->
  <audio id="bgVoice" preload="auto">
    <source src="https://raw.githubusercontent.com/Rajsekhar001/Promt/main/Paidvoice.mp3" type="audio/mpeg" />
  </audio>

  <div class="card">
    <div class="vip-badge">PAID UNBAN ₹349</div>
    <div class="sub-badge">★ VIP USER ONLY ★</div>
    
    <img src="https://raw.githubusercontent.com/Rajsekhar001/Promt/main/IMG_20261017_122814_174.jpg" alt="ROYAL UNBAN Logo" class="logo" />
    
    <h2>ROYAL UNBAN</h2>
    <p>&gt; ELITE VIP CONSOLE &lt;</p>

    <div class="ip-box" id="userIpDisplay">TARGET IP: FETCHING...</div>

    <!-- Step 1: Key Screen -->
    <div id="stepKey">
      <input type="text" id="keyInput" class="input-box" placeholder="ENTER VIP KEY..." />
      <button class="btn" onclick="verifyKey()">[ VERIFY VIP KEY ]</button>
      <button class="btn" onclick="openTelegram()">[ GET VIP KEY ]</button>
    </div>

    <!-- Step 2: UID Screen -->
    <div id="stepUID" style="display: none;">
      <input type="text" id="uidInput" class="input-box" placeholder="ENTER VIP TARGET UID..." />
      <button class="btn" onclick="startBypass()">[ START VIP PROCESS ]</button>
    </div>

    <!-- Terminal & Progress -->
    <div id="terminalConsole"></div>
    <div class="timer-display" id="timerDisplay">ELAPSED: 00:00 / 05:00</div>
    <div class="progress-wrapper" id="progressWrapper">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-text" id="progressText">0%</div>
    </div>

    <!-- 50% Switch Toggle Screen -->
    <div class="switch-panel" id="switchPanel">
      <p>⚠️ CONFIGURATION VERIFICATION REQUIRED (50%)</p>
      <button class="btn" onclick="enableSwitch()">[ TOGGLE ACTIVE CONFIG ]</button>
    </div>
  </div>

  <!-- 85% Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-box">
      <h3>⚠️ SECURITY HOLD: 85%</h3>
      <p>GATEWAY LOCKED AT 85%.<br>VIP ADMIN KEY REQUIRED TO RELEASE PACKETS.</p>
      <button class="btn-admin" onclick="openTelegram()">CONTACT ADMIN</button>
    </div>
  </div>

  <script>
    const VALID_KEY = "APEXUNBAN_PAID67G5R8";
    let clientIP = "127.0.0.1";
    let isPausedForSwitch = false;
    let voicePlayed = false;

    // First Click / Touch pe MP3 start hoga
    function playWelcomeVoice() {
      if (!voicePlayed) {
        const audio = document.getElementById("bgVoice");
        if (audio) {
          audio.play().then(() => {
            voicePlayed = true;
          }).catch(() => {});
        }
      }
    }

    // Direct page load pe bhi attempt karega
    window.addEventListener("DOMContentLoaded", () => {
      playWelcomeVoice();
    });

    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => {
        clientIP = data.ip;
        document.getElementById("userIpDisplay").innerText = "CLIENT IP: " + clientIP;
      })
      .catch(() => {
        document.getElementById("userIpDisplay").innerText = "CLIENT IP: 103.112.44.18";
      });

    function openTelegram() {
      window.location.href = "tg://resolve?domain=ROYAL_UNBAN";
      setTimeout(function() {
        window.location.href = "https://t.me/ROYAL_UNBAN";
      }, 500);
    }

    function verifyKey() {
      playWelcomeVoice();
      const enteredKey = document.getElementById("keyInput").value.trim();
      if (enteredKey === VALID_KEY) {
        document.getElementById("stepKey").style.display = "none";
        document.getElementById("stepUID").style.display = "block";
      } else {
        alert(">> INVALID VIP KEY // REDIRECTING...");
        openTelegram();
      }
    }

    function logTerminal(message) {
      const consoleBox = document.getElementById("terminalConsole");
      consoleBox.innerHTML += `<div>&gt; ${message}</div>`;
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function enableSwitch() {
      document.getElementById("switchPanel").style.display = "none";
      logTerminal("USER SWITCH CONFIRMED: PACKET FLOW RESUMED.");
      isPausedForSwitch = false;
    }

    function startBypass() {
      const uid = document.getElementById("uidInput").value.trim();
      if (!uid) {
        alert("Please enter target UID!");
        return;
      }

      document.getElementById("stepUID").style.display = "none";
      document.getElementById("terminalConsole").style.display = "block";
      document.getElementById("timerDisplay").style.display = "block";
      document.getElementById("progressWrapper").style.display = "block";

      logTerminal(`VIP PROTOCOL INITIATED // USER: ${uid}`);
      logTerminal(`PLAN: ₹349 VIP ACCESS`);

      const TOTAL_SECONDS = 300;
      let elapsedSeconds = 0;
      let switchTriggered = false;

      const runTimer = setInterval(function() {
        if (isPausedForSwitch) return;

        elapsedSeconds++;

        let mins = Math.floor(elapsedSeconds / 60);
        let secs = elapsedSeconds % 60;
        document.getElementById("timerDisplay").innerText = `ELAPSED: ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')} / 05:00`;

        let progress = (elapsedSeconds / TOTAL_SECONDS) * 85;
        if (progress > 85) progress = 85;

        document.getElementById("progressFill").style.width = progress.toFixed(1) + "%";
        document.getElementById("progressText").innerText = progress.toFixed(0) + "%";

        if (progress >= 50 && !switchTriggered) {
          switchTriggered = true;
          isPausedForSwitch = true;
          document.getElementById("switchPanel").style.display = "block";
          logTerminal("SYSTEM HALTED AT 50%: TOGGLE USER SWITCH TO CONTINUE.");
          return;
        }

        if (elapsedSeconds >= TOTAL_SECONDS) {
          clearInterval(runTimer);
          logTerminal("SERVER SECURITY TRIPPED AT 85%!");
          setTimeout(function() {
            document.getElementById("adminModal").style.display = "flex";
          }, 600);
        }
      }, 1000);
    }
  </script>

</body>
</html>
